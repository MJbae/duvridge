name: ToldLife

on:
  push:
    branches: [main]
    paths:
      - 'toldlife/**'
      - 'assets/brand/**'
      - 'assets/social/**'
      - 'scripts/*toldlife*.py'
      - '.github/workflows/toldlife.yml'
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: toldlife-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the ToldLife portal
        uses: actions/checkout@v5
        with:
          repository: MJbae/duvridge
          ref: main
          path: portal
          persist-credentials: false
      - name: Check out web novels
        uses: actions/checkout@v5
        with:
          repository: MJbae/bae-memoir
          ref: main
          path: novels
          persist-credentials: false
      - name: Check out audiobooks
        uses: actions/checkout@v5
        with:
          repository: MJbae/autobio-audiobook
          ref: main
          path: audiobooks
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            novels/package-lock.json
            audiobooks/web/package-lock.json
      - name: Install web novel dependencies
        run: npm ci --prefix novels
      - name: Install audiobook dependencies
        run: npm ci --prefix audiobooks/web
      - name: Test and build both ToldLife services
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: >-
          python portal/scripts/build-toldlife.py
          --novels-source novels
          --audiobooks-source audiobooks/web
      - name: Check source revisions before deploying
        id: before
        run: python portal/scripts/check-toldlife-revisions.py --portal portal --novels novels --audiobooks audiobooks
      - name: Deploy the combined ToldLife site
        if: steps.before.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.148.0 pages deploy portal/.deploy/toldlife --project-name toldlife --branch main --commit-dirty=true
      - name: Check source revisions after deploying
        id: after
        run: python portal/scripts/check-toldlife-revisions.py --portal portal --novels novels --audiobooks audiobooks
      - name: Queue a fresh build if any main branch advanced
        if: steps.after.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: gh workflow run toldlife.yml --repo "$CALLER_REPOSITORY" --ref main

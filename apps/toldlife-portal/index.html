  <style>
    :root { --night: #111318; --raised: #1c1f27; --line: #22252e; --ivory: #f3efe7; --gray: #b4b7c0; --gold: #e0ac4e; --gold-hover: #f2c677; --face-title: 'Hahmlet', 'Noto Serif KR', serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--night); color: var(--ivory); font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    img { display: block; max-width: 100%; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    /* One header for the platform: the wordmark, then the two series. The audiobook lives inside the original series. */
    .head { display: flex; flex-direction: column; }
    .wordmark { display: flex; align-items: center; height: 56px; padding: 0 20px; font-family: var(--face-title); font-size: 1.1875rem; font-weight: 800; letter-spacing: 0.02em; }
    .wordmark span { color: var(--gold); }
    .tabs { display: flex; gap: 22px; height: 44px; padding: 0 20px; border-bottom: 1px solid var(--line); }
    .tabs a { display: flex; align-items: center; height: 44px; color: var(--gray); font-size: 0.9375rem; font-weight: 500; white-space: nowrap; }
    .tabs a[aria-current='page'] { color: var(--ivory); font-weight: 600; box-shadow: inset 0 -2px 0 var(--gold); }
    /* Each tab is one panel; without JavaScript the address chooses it. */
    .panel { display: none; }
    .panel.is-active { display: block; }
    html:not(.js) .panels:has(.panel:target) .panel { display: none; }
    html:not(.js) .panels:has(.panel:target) .panel:target { display: block; }
    /* The featured work: its painting, its title and its button; the original series adds the audiobook as one quiet button. */
    .hero { position: relative; width: auto; height: 420px; margin: 16px 16px 0; border-radius: 14px; overflow: hidden; background: var(--raised); }
    .hero-art, .hero-art picture, .hero-art img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero-art img { object-fit: cover; object-position: 50% 50%; }
    .hero-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(17 19 24 / 0%) 40%, rgb(17 19 24 / 90%) 76%, var(--night) 100%); }
    .hero-copy { position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 18px; }
    .hero-title { margin: 0; font-family: var(--face-title); font-size: 1.875rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
    .big-button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; padding: 0 20px; border-radius: 12px; background: var(--gold); color: var(--night); font-size: 1rem; font-weight: 600; white-space: nowrap; }
    .big-button:hover { background: var(--gold-hover); }
    .big-button svg { flex-shrink: 0; }
    .hero-actions { display: flex; gap: 8px; }
    .hero-actions .big-button { flex: 1; min-width: 0; }
    .sub-button { display: flex; flex-shrink: 0; align-items: center; justify-content: center; gap: 7px; height: 54px; padding: 0 18px; border-radius: 12px; background: rgb(17 19 24 / 55%); box-shadow: inset 0 0 0 1px #4a4f5c; color: #cfcbc3; font-size: 0.9375rem; font-weight: 500; white-space: nowrap; }
    .sub-button:hover { color: var(--ivory); box-shadow: inset 0 0 0 1px var(--gray); }
    .sub-button svg { flex-shrink: 0; }
    /* Works: the same cells in both tabs, large while there are few; in the original series the last cell invites the next original. */
    .works { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 10px; margin: 0; padding: 32px 20px 40px; list-style: none; }
    .works a { display: flex; flex-direction: column; gap: 8px; }
    .works img { width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; object-position: 50% 50%; border-radius: 8px; background: var(--raised); }
    .work-name { font-size: 0.9375rem; font-weight: 600; line-height: 1.35; }
    .invite-card { display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 2 / 3; padding: 18px 16px; border: 1px solid #2c303b; border-radius: 8px; background: var(--raised); }
    .invite-dot { width: 10px; height: 10px; border-radius: 5px; background: var(--gold); }
    .invite-line { font-family: var(--face-title); font-size: 1.25rem; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
    .work-invite .work-name { color: var(--gold); }
    .work-invite:hover .work-name { color: var(--gold-hover); }
    .foot { display: none; }
    @media (min-width: 900px) {
      .head { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px 40px; max-width: 1200px; min-height: 72px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); }
      .wordmark { height: auto; padding: 0; font-size: 1.3125rem; }
      .tabs { gap: 4px 28px; height: auto; padding: 0; border: 0; }
      .tabs a { min-height: 44px; height: auto; font-size: 1rem; }
      .hero { height: auto; min-height: 440px; margin: 0; border-radius: 0; }
      .hero-art img { object-position: 62% 40%; }
      .hero-art::after { background: linear-gradient(to right, rgb(17 19 24 / 94%) 0%, rgb(17 19 24 / 70%) 36%, rgb(17 19 24 / 5%) 68%), linear-gradient(to bottom, rgb(17 19 24 / 0%) 70%, var(--night) 100%); }
      .hero-copy { position: relative; inset: auto; max-width: 1200px; min-height: 440px; margin: 0 auto; padding: 64px clamp(20px, 4vw, 40px) 48px; justify-content: flex-end; align-items: flex-start; gap: 24px; }
      .hero-title { max-width: 9em; font-size: clamp(2.25rem, 4.4vw, 3.5rem); line-height: 1.14; text-wrap: balance; }
      .big-button { min-width: 240px; padding: 0 28px; }
      .hero-actions .big-button { flex: 0 1 auto; }
      .works { grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 28px 16px; max-width: 1200px; margin: 0 auto; padding: 40px clamp(20px, 4vw, 40px) 64px; }
      .work-name { font-size: 1rem; }
      .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; max-width: 1200px; margin: 0 auto; padding: 20px clamp(20px, 4vw, 40px) 28px; border-top: 1px solid var(--line); color: var(--gray); font-size: 0.75rem; }
    }

  <script>
    (() => {
      // The home opens the tab in the address, else the one seen last, else the original series.
      const tabKey = 'family-library:home-tab'
      const tabs = ['novels', 'audiobooks', 'video']
      const read = key => { try { return JSON.parse(localStorage.getItem(key) || 'null') } catch { return null } }
      const remember = (key, value) => { try { localStorage.setItem(key, value) } catch {} }
      function show(tab) {
        for (const name of tabs) {
          document.getElementById(name).classList.toggle('is-active', name === tab)
          const link = document.querySelector(`[data-tab="${name}"]`)
          if (name === tab) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current')
        }
        remember(tabKey, tab)
      }
      const fromHash = () => tabs.find(name => location.hash === `#${name}`)
      let saved = null
      try { saved = localStorage.getItem(tabKey) } catch {}
      show(fromHash() || (tabs.includes(saved) ? saved : 'novels'))
      for (const link of document.querySelectorAll('[data-tab]')) {
        link.addEventListener('click', event => {
          event.preventDefault()
          history.replaceState(null, '', `#${link.dataset.tab}`)
          show(link.dataset.tab)
        })
      }
      addEventListener('hashchange', () => { const tab = fromHash(); if (tab) show(tab) })

      // Each tab's button carries on in its own format, from what the readers saved on this site.
      const order = ['prolog', ...Array.from({ length: 23 }, (_, index) => `ep${String(index + 1).padStart(2, '0')}`), 'epilog', 'side']
      const label = id => ({ prolog: '프롤로그', epilog: '에필로그', side: '외전' })[id] || `${Number(id.slice(2))}화`
      function set(tab, text, href, onClick) {
        const button = document.querySelector(`[data-action="${tab}"]`)
        button.querySelector('span').textContent = text
        button.setAttribute('href', href)
        if (onClick) button.addEventListener('click', onClick)
      }
      const reading = read('family-library:reading')
      if (reading && order.includes(reading.id)) {
        const next = order[order.indexOf(reading.id) + 1]
        if (!reading.finished) set('novels', `${label(reading.id)} 이어 읽기`, `/novels/read/${reading.id}.html`, () => remember('family-library:resume', JSON.stringify(reading)))
        else if (next) set('novels', `${label(next)} 읽기`, `/novels/read/${next}.html`)
        else set('novels', '이어 읽기', '/novels/')
      }
      // The audiobook and the video share one narration position.
      const narration = read('family-library:narration')
      const completed = read('family-library:completed')
      if (narration && order.includes(narration.id)) {
        set('audiobooks', `${label(narration.id)} 이어 듣기`, `/audiobooks/read/${narration.id}.html`)
        set('video', `${label(narration.id)} 이어 보기`, `/audiobooks/watch/${narration.id}.html`)
      } else if (Array.isArray(completed) && completed.length) {
        set('audiobooks', '이어 듣기', '/audiobooks/')
        set('video', '이어 보기', '/audiobooks/watch/')
      }
    })()
  </script>

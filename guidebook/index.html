<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 가이드북 앱 지원 — Duvridge</title>
<meta name="description" content="Duvridge 여행 가이드북 앱의 지원 페이지입니다. 문의처와 개인정보처리방침을 안내합니다.">
<style>
  :root{ color-scheme: light dark; }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    padding:3.5rem 1.25rem 4rem;
    font-family:system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    font-size:1rem;
    line-height:1.75;
    color:#1f1d1a;
    background:#fbfaf8;
    word-break:keep-all;
  }
  .wrap{ max-width:38rem; margin:0 auto; }
  .wordmark{
    margin:0 0 2.25rem;
    font-size:.8125rem;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#6b6558;
  }
  h1{ margin:0 0 .5rem; font-size:1.5rem; font-weight:600; letter-spacing:-.01em; }
  .status{
    display:inline-block;
    margin:0 0 1.75rem;
    padding:.15rem .55rem;
    border:1px solid #d5cfc2;
    border-radius:999px;
    font-size:.8125rem;
    color:#6b6558;
  }
  .lede{ margin:0 0 2.75rem; color:#3d3a34; }
  section{ margin:0 0 2.25rem; }
  h2{ margin:0 0 .4rem; font-size:1rem; font-weight:600; }
  p{ margin:0 0 .5rem; }
  a{ color:#2b3a5e; text-underline-offset:.18em; }
  a:hover{ opacity:.7; }
  .note{ font-size:.9375rem; color:#6b6558; }
  footer{
    margin-top:3.5rem;
    padding-top:1.5rem;
    border-top:1px solid #e4dfd4;
    font-size:.875rem;
    color:#6b6558;
  }
  footer p{ margin:0 0 .2rem; }
  @media (prefers-color-scheme: dark){
    body{ color:#e6e2da; background:#171614; }
    .wordmark,.status,.note,footer{ color:#9b958a; }
    .lede{ color:#c9c4ba; }
    .status{ border-color:#3a372f; }
    a{ color:#a8bade; }
    footer{ border-top-color:#2c2a25; }
  }
</style>
</head>
<body>
<main class="wrap">

  <p class="wordmark">Duvridge</p>

  <h1>여행 가이드북 앱</h1>
  <p class="status">출시 준비 중</p>

  <p class="lede">
    이미 짜둔 여행 일정으로 가이드북을 만들고, 함께 가는 일행과 공유해 모바일에서 볼 수 있는 앱입니다.
    현재 개발 중이며 아직 스토어에 공개되지 않았습니다.
  </p>

  <section>
    <h2>문의</h2>
    <p>제품 문의와 개인정보 관련 요청은 아래 이메일로 보내주세요.</p>
    <p><a href="mailto:contact@duvridge.com">contact@duvridge.com</a></p>
  </section>

  <section>
    <h2>개인정보처리방침</h2>
    <p><a href="/guidebook/privacy">개인정보처리방침 보기</a></p>
    <p class="note">앱 출시 시점에 실제 수집 항목을 반영하여 개정될 예정입니다.</p>
  </section>

  <footer>
    <p>Duvridge</p>
    <p>© 2026 Duvridge. All rights reserved.</p>
  </footer>

</main>
</body>
</html>

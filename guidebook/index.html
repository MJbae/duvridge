<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 가이드북 앱 지원 — Duvridge</title>
<meta name="description" content="Duvridge 여행 가이드북 앱의 지원 페이지입니다. 문의처와 개인정보처리방침을 안내합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  /* ---------- Tokens (matches www.duvridge.com) ---------- */
  :root{
    --paper:#E9E3D6;
    --paper-2:#E2DBCB;
    --ink:#1C1A16;
    --muted:#5C5645;
    --accent:#27324E;
    --navy-bg:#191F30;
    --on-dark:#E9E3D6;
    --muted-dark:#9AA3B8;
    --accent-dark:#AEBAD9;
    --line:rgba(28,26,22,.16);
    --line-dark:rgba(233,227,214,.18);
    --font-display:'Noto Serif KR','Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'Pretendard Variable','Pretendard',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:1rem; line-height:1.75;
    word-break:keep-all; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  /* faint paper grain, same texture as the main site */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;
  }
  a{ color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(39,50,78,.35); text-underline-offset:.18em; transition:border-color .2s, opacity .2s; }
  a:hover{ opacity:.72; }

  .site-head{
    position:relative; z-index:1;
    display:flex; align-items:center; max-width:38rem; margin:0 auto;
    padding:2rem 1.25rem 0;
  }
  .brand{ font-family:var(--font-display); font-weight:600; font-size:1.2rem; letter-spacing:-.02em; color:var(--ink); border:0; }
  .brand:hover{ border:0; opacity:.72; }
  .brand .dot{ color:var(--accent); }

  main.wrap{ position:relative; z-index:1; max-width:38rem; margin:0 auto; padding:2.5rem 1.25rem 5rem; }

  .eyebrow{
    font-family:var(--font-body); font-size:.72rem; font-weight:600; letter-spacing:.22em;
    text-transform:uppercase; color:var(--muted); margin:0 0 1.1rem;
  }
  h1{ font-family:var(--font-display); margin:0 0 .7rem; font-size:clamp(1.6rem,1.3rem + 1vw,2rem); font-weight:500; letter-spacing:-.01em; line-height:1.22; }
  .status{
    display:inline-block; margin:0 0 2rem; padding:.22rem .75rem;
    border:1px solid var(--line); border-radius:999px;
    font-family:var(--font-body); font-size:.78rem; font-weight:600; letter-spacing:.02em; color:var(--muted);
  }
  .lede{ margin:0 0 3rem; color:var(--muted); max-width:34rem; }
  section{ margin:0 0 2.4rem; padding-top:2.1rem; border-top:1px solid var(--line); }
  section:first-of-type{ border-top:0; padding-top:0; }
  h2{ font-family:var(--font-display); margin:0 0 .5rem; font-size:1.08rem; font-weight:500; letter-spacing:-.005em; }
  p{ margin:0 0 .6rem; }
  .note{ font-size:.9rem; color:var(--muted); }

  .foot{ position:relative; z-index:1; margin-top:3rem; background:var(--navy-bg); color:var(--on-dark); }
  .foot .wrap{ max-width:38rem; margin:0 auto; padding:2.6rem 1.25rem; text-align:center; }
  .foot-brand{ font-family:var(--font-display); font-weight:600; font-size:1.2rem; letter-spacing:-.02em; }
  .foot-brand .dot{ color:var(--accent-dark); }
  .foot-rights{ margin-top:1.5rem; padding-top:1.2rem; border-top:1px solid var(--line-dark); font-family:var(--font-body); font-size:.75rem; color:var(--muted-dark); letter-spacing:.02em; }
</style>
</head>
<body>

<header class="site-head">
  <a class="brand" href="https://www.duvridge.com" aria-label="duvridge — 홈으로">duvridge<span class="dot">.</span></a>
</header>

<main class="wrap">

  <p class="eyebrow">Support</p>
  <h1>여행 가이드북 앱</h1>
  <p class="status">출시 준비 중</p>

  <p class="lede">
    이미 짜둔 여행 일정으로 가이드북을 만들고, 함께 가는 일행과 공유해 모바일에서 볼 수 있는 앱입니다.
    현재 개발 중이며 아직 스토어에 공개되지 않았습니다.
  </p>

  <section>
    <h2>문의</h2>
    <p>제품 문의와 개인정보 관련 요청은 아래 이메일로 보내주세요.</p>
    <p><a href="mailto:contact@duvridge.com">contact@duvridge.com</a></p>
  </section>

  <section>
    <h2>개인정보처리방침</h2>
    <p><a href="/guidebook/privacy">개인정보처리방침 보기</a></p>
    <p class="note">앱 출시 시점에 실제 수집 항목을 반영하여 개정될 예정입니다.</p>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot-brand">duvridge<span class="dot">.</span></div>
    <div class="foot-rights">© 2026 Duvridge. All rights reserved.</div>
  </div>
</footer>

</body>
</html>
